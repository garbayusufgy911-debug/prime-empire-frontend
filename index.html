<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prime Empire Fintech</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .balance {
      font-size: 28px;
      font-weight: bold;
      color: #22c55e;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>

<header>
  💰 Prime Empire Fintech Dashboard
</header>

<div class="container">

  <div class="card">
    <h3>Wallet Balance</h3>
    <div class="balance">₦250,000</div>
    <button>Deposit</button>
    <button>Withdraw</button>
  </div>

  <div class="card">
    <h3>Transactions</h3>
    <p>✔ Deposit: ₦50,000</p>
    <p>✔ Transfer: ₦20,000</p>
    <p>✔ Payment: ₦10,000</p>
  </div>

  <div class="card">
    <h3>User Info</h3>
    <p>Name: Yusuf Garba</p>
    <p>Status: Active</p>
    <p>Tier: Premium</p>
  </div>

</div>

<footer>
  © 2026 Prime Empire Digital Finance
</footer>

</body>
</html>
